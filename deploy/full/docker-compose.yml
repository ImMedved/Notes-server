name: notes_server_stack

services:
  notes-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - notes-postgres-data:/var/lib/postgresql/data
    networks:
      - notes-backend

  notes-server:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - notes-postgres
    environment:
      NOTES_PORT: ${NOTES_PORT}
      NOTES_DB_URL: ${NOTES_DB_URL}
      NOTES_DB_USER: ${NOTES_DB_USER}
      NOTES_DB_PASSWORD: ${NOTES_DB_PASSWORD}
      NOTES_API_KEY: ${NOTES_API_KEY}
    ports:
      - "${NOTES_PORT}:8080"
    networks:
      - notes-backend

volumes:
  notes-postgres-data:

networks:
  notes-backend:
    name: notes-server-backend
